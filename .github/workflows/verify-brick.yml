name: Verify app_starter brick

on:
  pull_request:
    paths:
      - "bricks/app_starter/**"
      - ".github/workflows/verify-brick.yml"
  push:
    branches: [main]
    paths:
      - "bricks/app_starter/**"

jobs:
  generate-and-verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Mason CLI
        run: dart pub global activate mason_cli

      - name: Generate a test app from the brick
        run: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          mkdir -p /tmp/verify-app
          mason get
          cat > /tmp/verify-vars.json <<'EOF'
          {
            "project_name": "verify_app",
            "app_name": "Verify App",
            "application_id": "com.example.verify",
            "seed_color": "#1E88E5",
            "description": "CI verification app",
            "api_base_url_staging": "https://staging-api.example.com/api",
            "api_base_url_production": "https://api.example.com/api",
            "ios_app_store_url": "https://apps.apple.com/app/id0000000000"
          }
          EOF
          mason make app_starter -o /tmp/verify-app -c /tmp/verify-vars.json --on-conflict overwrite

      # Firebase's iOS podspec sometimes isn't in the runner's cached CocoaPods
      # trunk snapshot yet -- refresh it before the iOS builds below.
      - name: Update CocoaPods spec repo
        run: pod repo update

      - name: flutter analyze
        working-directory: /tmp/verify-app
        run: flutter analyze

      - name: flutter test
        working-directory: /tmp/verify-app
        run: flutter test

      # The feature generator's output must compile and pass its own tests --
      # including a model named `Order`, which clashes with dartz's `Order`
      # unless the generated imports use `show`.
      - name: Scaffold a feature with tool/new_feature.dart
        working-directory: /tmp/verify-app
        run: |
          dart run tool/new_feature.dart order_history --item Order
          flutter analyze
          flutter test test/order_history_controller_test.dart

      - name: Build Android (staging)
        working-directory: /tmp/verify-app
        run: flutter build apk --debug --flavor staging -t lib/main.dart

      - name: Build Android (di)
        working-directory: /tmp/verify-app
        run: flutter build apk --debug --flavor di -t lib/main.dart

      - name: Build Android (production)
        working-directory: /tmp/verify-app
        run: flutter build apk --debug --flavor production -t lib/main.dart

      - name: Build iOS (staging, no codesign)
        working-directory: /tmp/verify-app
        run: flutter build ios --no-codesign --debug --flavor staging -t lib/main.dart

      - name: Build iOS (di, no codesign)
        working-directory: /tmp/verify-app
        run: flutter build ios --no-codesign --debug --flavor di -t lib/main.dart

      - name: Build iOS (production, no codesign)
        working-directory: /tmp/verify-app
        run: flutter build ios --no-codesign --debug --flavor production -t lib/main.dart

      # Proves the scaffolded Fastlane lanes actually run, not just that the
      # Ruby parses -- macos-latest ships Ruby but not the fastlane gem.
      - name: Install Fastlane
        run: gem install fastlane

      - name: Run Fastlane build_staging (Android)
        working-directory: /tmp/verify-app/android
        run: fastlane build_staging

      - name: Run Fastlane build_staging (iOS)
        working-directory: /tmp/verify-app/ios
        run: fastlane build_staging

  # Releasing is bumping `version:` in bricks/app_starter/brick.yaml: once
  # everything above passes on main, tag it app_starter-v<version> if that tag
  # does not exist yet. Idempotent, and never moves an existing tag.
  tag:
    needs: generate-and-verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
      - name: Tag the brick version if it is new
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dart scripts/tag_brick.dart --push
