name: app_starter
description: >-
  A fully functional GetX starter app (fake auth, dashboard, settings) with
  staging/production flavors, .env config, and an in-app update prompt --
  rebrand for a new client in minutes.
version: 0.7.0
environment:
  mason: ">=0.1.0 <1.0.0"

vars:
  project_name:
    type: string
    description: Dart package name. lower_snake_case, starts with a letter, [a-z0-9_] only.
    default: my_starter_app
    prompt: "Package/project name (lower_snake_case, e.g. acme_rentals)"
  app_name:
    type: string
    description: Human-readable name shown on the home screen and in flavor labels.
    default: My Starter App
    prompt: "App display name (e.g. Acme Rentals)"
  application_id:
    type: string
    description: Exact Android applicationId / iOS bundleId for production (e.g. com.acme.rentals). Staging appends .staging. The project name is NOT appended.
    default: com.example.myapp
    prompt: "Application ID, used exactly as typed (e.g. com.acme.rentals)"
  seed_color:
    type: string
    description: 6-digit hex, with or without leading '#'. Drives ColorScheme.fromSeed.
    default: "#6750A4"
    prompt: "Brand seed color (hex, e.g. #6750A4)"
  description:
    type: string
    description: pubspec.yaml one-liner.
    default: A Flutter app generated from app_starter.
    prompt: "Short project description"
  api_base_url_staging:
    type: string
    default: https://staging-api.example.com/api
    prompt: "Staging API base URL, including the /api prefix (endpoints are appended to it)"
  api_base_url_production:
    type: string
    default: https://api.example.com/api
    prompt: "Production API base URL, including the /api prefix (endpoints are appended to it)"
  ios_app_store_url:
    type: string
    description: App Store listing opened by the in-app update dialog. The ID only exists once the app is created in App Store Connect.
    default: https://apps.apple.com/app/id0000000000
    prompt: "iOS App Store URL (e.g. https://apps.apple.com/app/id1234567890)"
